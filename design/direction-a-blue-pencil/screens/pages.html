<!doctype html>
<html lang="en" data-platform="mac">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pages: Smorsy PDF Editor</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../../shared/paper.css">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="../screens.css">
</head>
<body>
<div class="window">
  
  <header class="bar">
    <div class="bar-start"><div class="os-controls" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="file"><span class="file-name">Home insurance claim.pdf</span><span class="file-state">1 unsaved change</span></div>
    </div>
    <nav class="modes" aria-label="Editor mode">
      <a class="mode" href="select.html"><svg class="icon " viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 2.5l9 5-4 1-2 4z"/></svg>Select</a>
      <a class="mode" href="edit-text.html"><svg class="icon " viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4V2.75h10V4M8 2.75v10.5M6 13.25h4"/></svg>Edit text</a>
      <a class="mode" href="annotate.html"><svg class="icon " viewBox="0 0 16 16" aria-hidden="true"><path d="M10.5 2.5l3 3-7.5 7.5-3.75.75.75-3.75zM2.5 14.5h11"/></svg>Annotate</a>
      <a class="mode" href="sign.html"><svg class="icon " viewBox="0 0 16 16" aria-hidden="true"><path d="M2 11.5c2-5 3.5-8 4.75-8 1.75 0-1.25 8 .5 8 1.25 0 1.75-2.75 3-2.75 1 0 .75 2 2 2h1.75M2 14.25h12"/></svg>Sign</a>
      <a class="mode" href="pages.html" aria-current="page"><svg class="icon " viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 4.5v-2h8v9h-2M2.5 4.5h9v9h-9z"/></svg>Pages</a>
    </nav>
    <div class="bar-end">
      <a class="icon-btn" href="select.html" aria-label="Search" title="Search (⌘F)"><svg class="icon " viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5l3 3"/></svg></a>
      <button class="icon-btn" aria-label="Undo" title="Undo (⌘Z)"><svg class="icon " viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 3l-3 3 3 3M2.5 6h7a4 4 0 010 8h-3"/></svg></button>
      <button class="icon-btn" aria-label="Redo" title="Redo (⇧⌘Z)" disabled><svg class="icon " viewBox="0 0 16 16" aria-hidden="true"><path d="M10.5 3l3 3-3 3M13.5 6h-7a4 4 0 000 8h3"/></svg></button>
      <a class="btn btn-primary" href="error-save.html">Save a copy</a>
    </div>
  </header>
  <div class="body full">
    <div class="pages-stage">
      <div class="pages-tools" role="toolbar" aria-label="Page tools">
        <button class="tool" aria-label="Rotate left" title="Rotate left"><svg class="icon " viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 3v3.5H6M2.8 6.5A5.5 5.5 0 118 13.5"/></svg><span class="tool-label">Rotate left</span></button><button class="tool" aria-label="Rotate right" title="Rotate right"><svg class="icon " viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 3v3.5H10M13.2 6.5A5.5 5.5 0 108 13.5"/></svg><span class="tool-label">Rotate right</span></button><button class="tool" aria-label="Duplicate" title="Duplicate"><svg class="icon " viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 5.5h8v8h-8zM10.5 5.5v-3h-8v8h3"/></svg><span class="tool-label">Duplicate</span></button><button class="tool" aria-label="Delete" title="Delete"><svg class="icon " viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4.5h11M6 4.5v-2h4v2M4 4.5l.75 9h6.5l.75-9"/></svg><span class="tool-label">Delete</span></button><button class="tool" aria-label="Extract" title="Extract"><svg class="icon " viewBox="0 0 16 16" aria-hidden="true"><path d="M3 9.5v4h10v-4M8 2.5v8M5 7.5l3 3 3-3"/></svg><span class="tool-label">Extract</span></button>
        <span class="sep"></span>
        <button class="tool" aria-label="Insert" title="Insert"><svg class="icon " viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 2.5h9v11h-9zM8 5.5v5M5.5 8h5"/></svg><span class="tool-label">Insert</span></button><button class="tool" aria-label="Merge" title="Merge"><svg class="icon " viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2.5v3c0 2 5 2.5 5 5v3M13 2.5v3c0 2-5 2.5-5 5M5.5 11l2.5 2.5 2.5-2.5"/></svg><span class="tool-label">Merge</span></button><button class="tool" aria-label="Split" title="Split"><svg class="icon " viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5v4c0 2-5 2.5-5 4v3M8 6.5c0 2 5 2.5 5 4v3M1 11.5l2 2 2-2M11 11.5l2 2 2-2"/></svg><span class="tool-label">Split</span></button>
      </div>
      <ol class="page-grid" aria-label="Pages in this document">
        <li><button class="tile" aria-pressed="false" aria-label="Page 1"><span class="tile-sheet "></span><span class="tile-num">1</span><span class="tile-tag"></span></button></li><li><button class="tile" aria-pressed="false" aria-label="Page 2, 1 change"><span class="tile-sheet "></span><span class="tile-num">2</span><span class="tile-tag">1 change</span></button></li><li><button class="tile" aria-pressed="true" aria-label="Page 3"><span class="tile-check"><svg class="icon " viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.5 3.5 6.5-8"/></svg></span><span class="tile-sheet "></span><span class="tile-num">3</span><span class="tile-tag"></span></button></li><li><button class="tile" aria-pressed="true" aria-label="Page 4"><span class="tile-check"><svg class="icon " viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.5 3.5 6.5-8"/></svg></span><span class="tile-sheet "></span><span class="tile-num">4</span><span class="tile-tag"></span></button></li>
        <li><button class="tile" aria-pressed="false" aria-label="Page 5, Landscape"><span class="tile-sheet wide"></span><span class="tile-num">5</span><span class="tile-tag">Landscape</span></button></li><li><button class="tile" aria-pressed="false" aria-label="Page 6, Scanned"><span class="tile-sheet scan"></span><span class="tile-num">6</span><span class="tile-tag">Scanned</span></button></li><li><button class="tile" aria-pressed="false" aria-label="Page 7, Receipt"><span class="tile-sheet small"></span><span class="tile-num">7</span><span class="tile-tag">Receipt</span></button></li><li><button class="tile" aria-pressed="false" aria-label="Page 8"><span class="tile-sheet "></span><span class="tile-num">8</span><span class="tile-tag"></span></button></li><li><span class="insert-mark" aria-hidden="true"></span><button class="tile" aria-pressed="false" aria-label="Page 9"><span class="tile-sheet "></span><span class="tile-num">9</span><span class="tile-tag"></span></button></li><li><button class="tile" aria-pressed="false" aria-label="Page 10"><span class="tile-sheet "></span><span class="tile-num">10</span><span class="tile-tag"></span></button></li><li><button class="tile" aria-pressed="false" aria-label="Page 11"><span class="tile-sheet "></span><span class="tile-num">11</span><span class="tile-tag"></span></button></li>
      </ol>
    </div>
  </div>
  <footer class="status">
    <div class="status-part"><span>2 of 11 pages selected</span><span class="status-hint">Drag pages to reorder them</span></div>
    <div class="status-part"><span>Your original file stays unchanged</span></div>
  </footer>
</div>
</body>
</html>
