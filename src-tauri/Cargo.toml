[package]
name = "smorsy-pdf-editor"
version = "0.1.0"
description = "A private, offline PDF editor"
edition = "2021"
rust-version = "1.85"

[lib]
name = "smorsy_pdf_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-fs = "2.7"
tauri-plugin-wdio = { version = "1.5", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.5", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
# Test builds only. It runs a WebDriver server inside the app, so CI fails if a release includes it.
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[profile.release]
lto = true
codegen-units = 1
strip = true
